# Vendored from https://github.com/risechain/pevm @ e94b0e3df9c0c1b983ed3e4d78b3aefb0b5b7cc0
# src/ is unmodified. Package name is pevm_upstream so it links beside this workspace's pevm.
# benches/mainnet.rs adds PEVM_BENCH_CONCURRENCY and imports this package name.
[package]
edition.workspace = true
name = "pevm_upstream"
version = "0.1.0"

[features]
defaults = []

rpc-storage = ["dep:alloy-transport", "dep:reqwest", "dep:tokio"]

global-alloc = ["dep:rpmalloc", "dep:snmalloc-rs", "dep:tikv-jemallocator"]

[dependencies]
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-trie.workspace = true

bitflags.workspace = true
dashmap.workspace = true
hashbrown.workspace = true
rustc-hash.workspace = true
serde.workspace = true
smallvec.workspace = true
thiserror.workspace = true

op-revm.workspace = true
revm.workspace = true

op-alloy-consensus.workspace = true
op-alloy-network.workspace = true
op-alloy-rpc-types.workspace = true

# Storage RPC feature dependencies
alloy-transport = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Various allocators for benchmarks
rpmalloc = { workspace = true, optional = true }
snmalloc-rs = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
criterion.workspace = true
flate2.workspace = true
rand.workspace = true
rayon.workspace = true
reqwest.workspace = true
revm-statetest-types.workspace = true
revme.workspace = true
serde_json.workspace = true
tokio.workspace = true
walkdir.workspace = true

[lints]
workspace = true

[[bench]]
harness = false
name = "mainnet"

# gigagas.rs is the upstream file, unchanged. It is not a Cargo target: it
# pulls tests/erc20 and tests/uniswap, which are not part of this vendor.
