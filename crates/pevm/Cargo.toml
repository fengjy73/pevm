[package]
edition.workspace = true
name = "pevm"
version = "0.1.0"

[features]
defaults = []

# SpecFence parallel engine. Compiled out entirely when this feature is off.
# Upstream OCC (`Pevm::execute` / `execute_revm_parallel`) does not call into it.
specfence = []
# Compile the inflation harness with mimalloc as the global allocator.
# The default harness does not install a global allocator at all.
specfence-mimalloc = []

rpc-storage = ["dep:alloy-transport", "dep:reqwest", "dep:tokio"]

global-alloc = ["dep:rpmalloc", "dep:snmalloc-rs", "dep:tikv-jemallocator"]

[dependencies]
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-trie.workspace = true

bitflags.workspace = true
dashmap.workspace = true
hashbrown.workspace = true
rustc-hash.workspace = true
serde.workspace = true
smallvec.workspace = true
thiserror.workspace = true

op-revm.workspace = true
revm.workspace = true

op-alloy-consensus.workspace = true
op-alloy-network.workspace = true
op-alloy-rpc-types.workspace = true

# Storage RPC feature dependencies
alloy-transport = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Various allocators for benchmarks
rpmalloc = { workspace = true, optional = true }
snmalloc-rs = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
criterion.workspace = true
flate2.workspace = true
mimalloc = "0.1.43"
rand.workspace = true
rayon.workspace = true
reqwest.workspace = true
revm-statetest-types.workspace = true
revme.workspace = true
serde_json.workspace = true
tokio.workspace = true
walkdir.workspace = true

[lints]
workspace = true

[[example]]
name = "specfence_inflation_dig"
required-features = ["specfence"]

[[bench]]
harness = false
name = "mainnet"

[[bench]]
harness = false
name = "gigagas"
